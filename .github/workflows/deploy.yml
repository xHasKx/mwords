name: Deploy to GitHub Pages

on:
  push:
    branches: [release]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# GitHub's recommendation for Pages — let an in-flight deploy
# complete before the next starts; cancelling can leave Pages in
# a half-deployed state.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v5
