<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=overlays-content" />
    <meta name="theme-color" content="#0b0e14" />
    <title>mwords</title>
    <script>
      // Firefox Android reports a non-zero env(safe-area-inset-bottom)
      // even when the system nav lives outside the layout viewport,
      // which inflates our bottom-padding cap. Narrow the override to
      // Firefox only — Chrome Android (and the Capacitor WebView, which
      // is Chrome-based) need the real value so the --safe-area-inset-*
      // vars (injected by Capacitor 8's SystemBars on Android, native
      // env() on iOS) actually take effect.
      if (/Firefox/.test(navigator.userAgent) && /Android/i.test(navigator.userAgent)) {
        document.documentElement.style.setProperty('--safe-bottom', '0px');
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
